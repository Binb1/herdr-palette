id = "binb1.palette"
name = "Palette"
version = "0.2.0"
description = "Command palette for Herdr. Jump to workspaces and agents, run plugin actions, run Herdr commands."
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]

# Download the prebuilt binary for this platform from the matching GitHub
# Release (no Go toolchain needed). `herdr plugin link` skips this — for a
# local checkout, run: go build -o bin/herdr-palette .
[[build]]
command = ["bash", "install.sh"]

[[actions]]
id = "open"
title = "Toggle command palette"
contexts = ["global"]
command = ["sh", "-c", "if pgrep -x herdr-palette >/dev/null; then pkill -x herdr-palette; else exec \"$HERDR_BIN_PATH\" plugin pane open --plugin binb1.palette --entrypoint palette; fi"]

[[panes]]
id = "palette"
title = "Palette"
placement = "popup"
width = 72
height = 20
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-palette\""]
